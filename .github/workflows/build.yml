name: Build T9Hebrew EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0) — leave empty for dev build'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''

      - name: Install build dependencies
        run: pip install pyinstaller

      - name: Download Hebrew dictionary
        run: |
          python -c "
          import urllib.request, os
          url = 'https://raw.githubusercontent.com/LibreOffice/dictionaries/master/he_IL/he_IL.dic'
          urllib.request.urlretrieve(url, 'he_IL.dic')
          print('Dictionary downloaded:', os.path.getsize('he_IL.dic'), 'bytes')
          "

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name T9Hebrew --add-data "he_IL.dic;." main.py

      - name: Verify build output
        run: |
          if (Test-Path "dist\T9Hebrew.exe") {
            $size = (Get-Item "dist\T9Hebrew.exe").Length / 1MB
            Write-Host "Build successful! EXE size: $([math]::Round($size,2)) MB"
          } else {
            Write-Error "Build failed — EXE not found"
            exit 1
          }
        shell: pwsh

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: T9Hebrew-${{ github.run_number }}
          path: dist/T9Hebrew.exe
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event.inputs.version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: T9Hebrew ${{ github.event.inputs.version }}
          body: |
            ## מפענח T9 עברי — ${{ github.event.inputs.version }}

            ### הורדה
            הורד את `T9Hebrew.exe` מהקבצים המצורפים למטה.

            ### הפעלה
            לחץ פעמיים על הקובץ — אין צורך בהתקנה.
          files: dist/T9Hebrew.exe
          draft: false
          prerelease: false
